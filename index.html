<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed Gamal Mahmoud | Software Engineer</title>
<meta name="description" content="Mohamed Gamal Mahmoud, software engineer focused on backend development: Java, Spring Boot, REST APIs and databases.">
<style>
:root{--bg:#fff;--fg:#000;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h2{font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin-bottom:12px}
.lead{color:var(--mut);max-width:52ch;margin-bottom:40px}
nav{position:fixed;inset:0 0 auto;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none;padding:0;font-size:14px}
nav ul a{text-decoration:none;color:var(--mut)}nav ul a:hover{color:#000}
.btn{display:inline-block;padding:12px 22px;border-radius:99px;border:1.5px solid #000;font-weight:600;font-size:14px;text-decoration:none;background:#fff;cursor:pointer;font-family:inherit;color:#000}
.btn.dark{background:#000;color:#fff}.btn:hover{transform:translateY(-1px)}
/* hero */
#home{padding:56px 0 0;min-height:100svh;position:relative;overflow:hidden}
.hero{position:relative;min-height:calc(100svh - 56px);display:flex;align-items:flex-end;padding-bottom:56px}
.big{position:absolute;left:0;bottom:120px;font-size:clamp(84px,21vw,300px);font-weight:900;letter-spacing:-.08em;line-height:.8;color:#e4e4e4;user-select:none;white-space:nowrap}
.vid{position:absolute;right:max(24px,8vw);top:40px;width:min(380px,62vw);aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:var(--soft);border:1.5px solid #000;box-shadow:12px 12px 0 #000;display:grid;place-items:center}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;gap:22px;font-size:84px;font-weight:900;letter-spacing:-.06em}
.wave{display:flex;gap:6px;align-items:center;height:44px}
.wave i{width:6px;height:10px;border-radius:3px;background:#000;animation:w 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{50%{height:44px}}
.snd{position:absolute;left:12px;bottom:12px;padding:8px 14px;font-size:13px}
.intro{position:relative;z-index:2;max-width:560px}
.intro h1{font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:-.04em;font-weight:800}
.intro p{color:var(--mut);margin:16px 0 24px;max-width:44ch}
.intro .btn{margin:0 8px 8px 0}
/* id card */
#id{background:var(--soft)}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.scene{perspective:1100px;justify-self:center;width:min(340px,100%)}
.card{position:relative;width:100%;aspect-ratio:54/86;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer;outline-offset:6px;border-radius:22px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;padding:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border:1.5px solid #000}
.front{background:#000;color:#fff}
.back{background:#fff;transform:rotateY(180deg)}
.slot{width:56px;height:8px;border-radius:4px;background:#333;margin:0 auto 22px}
.avatar{width:120px;height:120px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:44px;font-weight:900;letter-spacing:-.06em;margin:0 auto 20px}
.face h3{font-size:24px;letter-spacing:-.03em;line-height:1.1}
.face .role{color:#9a9a9a;margin:4px 0 auto;font-size:14px}
.front dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.front dt{color:#8a8a8a}
.hint{font-size:12px;color:#8a8a8a;text-align:center;margin-top:16px}
.back ul{list-style:none;padding:0;display:grid;gap:12px;margin-top:14px;font-size:14px}
.back a{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;text-decoration:none;font-weight:600}
.back small{color:var(--mut);font-weight:400}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin-top:8px}
.stats b{display:block;font-size:40px;letter-spacing:-.04em;line-height:1}
.stats span{color:var(--mut);font-size:14px}
/* periodic table */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:8px 16px;border-radius:99px;border:1.5px solid #000;background:#fff;font:600 13px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:#000;color:#fff}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.el{border:1.5px solid #000;border-radius:10px;padding:8px 10px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;background:#fff;transition:.2s}
.el .n{font-size:11px;color:var(--mut)}
.el .s{font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1}
.el .nm{font-size:11px;line-height:1.2}
.el:hover{background:#000;color:#fff}.el:hover .n{color:#aaa}
.el.soon{border-style:dashed}
.el.dim{opacity:.18}
.note{font-size:13px;color:var(--mut);margin-top:16px}
/* work */
.work{display:grid;gap:0;border-top:1.5px solid #000}
.proj{display:grid;grid-template-columns:1.1fr 2fr auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none}
.proj h3{font-size:clamp(22px,3vw,32px);letter-spacing:-.03em;line-height:1.1}
.proj p{color:var(--mut);font-size:15px}
.proj small{display:block;color:#000;margin-top:6px;font-size:13px}
.proj .go{border:1.5px solid #000;border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.proj:hover{background:var(--soft)}.proj:hover .go{background:#000;color:#fff}
/* achievements */
#ach{background:#000;color:#fff;overflow:hidden}
#ach .lead{color:#aaa}
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 24px 28px;scrollbar-width:thin;scrollbar-color:#fff #222}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:#fff;border-radius:3px}
.ach{flex:0 0 min(360px,80vw);scroll-snap-align:start;border:1.5px solid #fff;border-radius:22px;padding:28px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.ach b{font-size:64px;letter-spacing:-.06em;line-height:1}
.ach h3{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.ach p{color:#aaa;font-size:15px}
.ach:nth-child(even){background:#fff;color:#000}.ach:nth-child(even) p{color:#555}
/* contact */
.mail{font-size:clamp(26px,6vw,72px);font-weight:800;letter-spacing:-.05em;line-height:1.05;word-break:break-all;text-decoration:none;display:block;margin:8px 0 28px}
.mail:hover{text-decoration:underline;text-underline-offset:8px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:13px}
.rv{opacity:0;transform:translateY(18px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(max-width:820px){nav ul{display:none}.idgrid{grid-template-columns:1fr}.proj{grid-template-columns:1fr;gap:10px}.proj .go{justify-self:start}.vid{position:relative;right:auto;top:auto;margin:24px auto 0}.hero{flex-direction:column-reverse;align-items:flex-start;justify-content:flex-end}.big{bottom:auto;top:30%}section{padding:72px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
