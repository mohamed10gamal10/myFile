<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed Gamal Mahmoud | Software Engineer</title>
<meta name="description" content="Mohamed Gamal Mahmoud, software engineer focused on backend development: Java, Spring Boot, REST APIs and databases.">
<style>
:root{--bg:#fff;--fg:#000;--mut:#6b6b6b;--line:#dcdcdc;--soft:#f3f3f3}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h2{font-size:clamp(32px,5vw,56px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin-bottom:12px}
.lead{color:var(--mut);max-width:52ch;margin-bottom:40px}
nav{position:fixed;inset:0 0 auto;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none;padding:0;font-size:14px}
nav ul a{text-decoration:none;color:var(--mut)}nav ul a:hover{color:#000}
.btn{display:inline-block;padding:12px 22px;border-radius:99px;border:1.5px solid #000;font-weight:600;font-size:14px;text-decoration:none;background:#fff;cursor:pointer;font-family:inherit;color:#000}
.btn.dark{background:#000;color:#fff}.btn:hover{transform:translateY(-1px)}
/* hero */
#home{padding:56px 0 0;min-height:100svh;position:relative;overflow:hidden}
.hero{position:relative;min-height:calc(100svh - 56px);display:flex;align-items:flex-end;padding-bottom:56px}
.big{position:absolute;left:0;bottom:120px;font-size:clamp(84px,21vw,300px);font-weight:900;letter-spacing:-.08em;line-height:.8;color:#e4e4e4;user-select:none;white-space:nowrap}
.vid{position:absolute;right:max(24px,8vw);top:40px;width:min(380px,62vw);aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:var(--soft);border:1.5px solid #000;box-shadow:12px 12px 0 #000;display:grid;place-items:center}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;gap:22px;font-size:84px;font-weight:900;letter-spacing:-.06em}
.wave{display:flex;gap:6px;align-items:center;height:44px}
